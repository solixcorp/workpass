openapi: 3.1.0
info:
  title: Internal Auth Backend API
  version: 1.0.0-draft
  description: >-
    Partial OpenAPI contract for application-owned endpoints. Better Auth plugin
    routes and OIDC discovery metadata are also served by the Worker; see
    backend-api-v1.md and the runtime discovery document for those contracts.
servers:
  - url: https://{idpHost}
    variables:
      idpHost:
        default: id.example.com
security:
  - sessionCookie: []
paths:
  /:
    get:
      operationId: getServiceInfo
      security: []
      summary: Service metadata and protocol documentation pointers
      responses:
        "200":
          description: Public service metadata.
          content:
            application/json:
              schema:
                type: object
                required: [service, status, documentation, openidConfiguration]
                properties:
                  service: { type: string }
                  status: { type: string }
                  documentation: { type: string }
                  openidConfiguration: { type: string }
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Worker liveness
      responses:
        "200":
          description: Worker is responding.
          content:
            application/json:
              schema:
                type: object
                required: [status, runtime]
                properties:
                  status:
                    const: ok
                  runtime:
                    const: cloudflare-workers
  /_internal/migrate:
    post:
      operationId: migrateDatabase
      security:
        - migrationBearer: []
      summary: Run Better Auth and audit D1 migrations
      description: >-
        Only available while ENABLE_MIGRATIONS is true and MIGRATION_TOKEN is
        configured. Disable both immediately after controlled initialization.
      responses:
        "200":
          description: Migrations applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: migrated
        "401":
          description: Missing or invalid migration token.
        "404":
          description: Migration route disabled.
        "500":
          description: Migration failed.
  /api/admin/bootstrap:
    post:
      operationId: bootstrapFirstAdmin
      security:
        - bootstrapBearer: []
      summary: Create the first administrator (temporarily enabled only)
      description: >-
        Available only while ENABLE_ADMIN_BOOTSTRAP is true and only before
        any user exists. The bearer token is a temporary secret. The operation
        assigns the admin role and is audited in D1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, username, password]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "201":
          description: The first administrator was created.
        "404":
          description: Bootstrap is disabled or token is invalid.
        "409":
          description: A user exists or bootstrap has already been claimed.
        "503":
          description: Audit persistence failed; inspect the event record before retrying.
        "400":
          description: Malformed body or missing required fields.
  /api/admin/audit-events:
    get:
      operationId: listAuditEvents
      summary: Query security audit events (admin only)
      parameters:
        - in: query
          name: actorUserId
          schema: { type: string }
        - in: query
          name: targetUserId
          schema: { type: string }
        - in: query
          name: eventType
          schema: { type: string }
        - in: query
          name: outcome
          schema:
            type: string
            enum: [started, success, failure]
        - in: query
          name: from
          description: Inclusive ISO-8601 timestamp.
          schema: { type: string, format: date-time }
        - in: query
          name: to
          description: Inclusive ISO-8601 timestamp.
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: cursor
          description: Opaque event ID from the prior response's nextCursor field.
          schema: { type: string }
      responses:
        "200":
          description: Matching events. Secrets and request bodies are excluded.
          content:
            application/json:
              schema:
                type: object
                required: [events, limit, nextCursor]
                properties:
                  limit: { type: integer }
                  nextCursor:
                    type: [string, "null"]
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
        "401":
          description: No valid IdP session.
        "403":
          description: Authenticated user is not an administrator.
  /api/auth/sign-in/email:
    post:
      operationId: signInWithEmail
      security: []
      summary: Start a username-independent email/password session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                rememberMe: { type: boolean }
                callbackURL: { type: string, format: uri }
      responses:
        "200":
          description: Authenticated; Worker sets an HttpOnly session cookie.
          headers:
            Set-Cookie:
              description: Secure, HttpOnly, SameSite IdP session cookie.
              schema: { type: string }
        "401":
          description: Invalid credentials.
  /api/auth/sign-up/email:
    post:
      operationId: denyPublicSignup
      security: []
      summary: Public signup is disabled
      responses:
        "404":
          description: Registration is not available.
        "503":
          description: Denial audit event could not be persisted.
  /api/auth/sign-in/username:
    post:
      operationId: signInWithUsername
      security: []
      summary: Start a username/password session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                rememberMe: { type: boolean }
                callbackURL: { type: string, format: uri }
      responses:
        "200":
          description: Authenticated; Worker sets an HttpOnly session cookie.
          headers:
            Set-Cookie:
              description: Secure, HttpOnly, SameSite IdP session cookie.
              schema: { type: string }
        "401":
          description: Invalid credentials.
  /api/auth/admin/create-user:
    post:
      operationId: createEmployee
      summary: Create an employee account (administrator only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password, data]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                password: { type: string, format: password }
                role:
                  type: string
                  default: user
                data:
                  type: object
                  required: [username]
                  properties:
                    username: { type: string }
      responses:
        "200":
          description: Employee created. Response does not return the password.
        "401":
          description: No valid IdP session.
        "403":
          description: Authenticated user is not permitted to create users.
        "404":
          description: Public signup route remains unavailable.
  /api/admin/audit-events/verify:
    get:
      operationId: verifyAuditLog
      summary: Recompute the tamper-evidence hashes of the positioned audit log (admin only)
      responses:
        "200":
          description: Verification result with per-position coverage and legacy-entry count.
          content:
            application/json:
              schema:
                type: object
                required: [verification]
                properties:
                  verification:
                    type: object
                    required: [verified, entries, legacyEntries, firstProblem]
                    properties:
                      verified: { type: boolean }
                      entries: { type: integer }
                      legacyEntries: { type: integer }
                      firstProblem: { type: [string, "null"] }
  /api/admin/audit-events/{eventId}:
    get:
      operationId: getAuditEvent
      summary: Retrieve one audit event (admin only)
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The event.
        "404": { description: Not found. }
  /api/admin/saml-service-providers:
    get:
      operationId: listSamlServiceProviders
      summary: List SAML SP registrations (admin only; omits certificates)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Registrations ordered by id.
    post:
      operationId: createSamlServiceProvider
      summary: Register a SAML SP (disabled by default; admin only, exact Origin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entityId, acsUrl, signingCertificate]
              properties:
                entityId: { type: string, maxLength: 2048 }
                acsUrl: { type: string, format: uri }
                signingCertificate: { type: string, description: PEM-encoded X.509 certificate }
      responses:
        "201": { description: Created disabled. }
        "409": { description: entityId already registered. }
  /api/admin/saml-service-providers/{id}:
    get:
      operationId: getSamlServiceProvider
      summary: Retrieve one SAML SP registration (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: The registration with the certificate. }
        "404": { description: Not found. }
    delete:
      operationId: deleteSamlServiceProvider
      summary: Remove a disabled SAML SP registration (admin only, exact Origin)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Removed. }
        "409": { description: Enabled registrations must be disabled first. }
  /api/admin/saml-service-providers/{id}/enable:
    post:
      operationId: enableSamlServiceProvider
      summary: Enable a SAML SP whose certificate imports as a usable RSA verify key
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Enabled. }
        "400": { description: The stored certificate is not usable. }
  /api/admin/saml-service-providers/{id}/disable:
    post:
      operationId: disableSamlServiceProvider
      summary: Disable a SAML SP registration
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Disabled. }
  /saml/sso:
    get:
      operationId: samlSingleSignOn
      security: []
      summary: SAML SSO via HTTP-Redirect binding (signed AuthnRequest required)
      parameters:
        - in: query
          name: SAMLRequest
          required: true
          schema: { type: string }
        - in: query
          name: SigAlg
          schema: { type: string }
        - in: query
          name: Signature
          schema: { type: string }
        - in: query
          name: RelayState
          schema: { type: string }
      responses:
        "200":
          description: Auto-submitting POST form carrying the signed Response to the registered ACS.
        "400": { description: Generic rejection; the stage is recorded server-side. }
        "401": { description: Issuer has no enabled registration. }
        "503": { description: Identity-provider signing material is not configured. }
  /saml/metadata:
    get:
      operationId: samlIdpMetadata
      security: []
      summary: SAML IdP metadata (rotation publishes both signing KeyDescriptors)
      responses:
        "200":
          description: application/samlmetadata+xml entity descriptor.
        "503": { description: Signing material not configured. }
  /scim/v2/Users:
    post:
      operationId: scimInboundCreateUser
      summary: Inbound SCIM — provision a user (no credential attached)
      security: [{ inboundScimBearer: [] }]
      responses: { "201": { description: Created } }
    get:
      operationId: scimInboundListUsers
      summary: Inbound SCIM — list/filter users
      security: [{ inboundScimBearer: [] }]
      responses: { "200": { description: ListResponse } }
  /scim/v2/Users/{id}:
    get:
      operationId: scimInboundGetUser
      summary: Inbound SCIM — get a user
      security: [{ inboundScimBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: User }, "404": { description: Not found } }
    put:
      operationId: scimInboundReplaceUser
      summary: Inbound SCIM — replace a user
      security: [{ inboundScimBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: User } }
    patch:
      operationId: scimInboundPatchUser
      summary: Inbound SCIM — patch active/deactivation
      security: [{ inboundScimBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: User } }
    delete:
      operationId: scimInboundDeleteUser
      summary: Inbound SCIM — delete deactivates (ban), never destroys
      security: [{ inboundScimBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Deactivated } }
  /scim/v2/ServiceProviderConfig:
    get:
      operationId: scimInboundServiceProviderConfig
      summary: Inbound SCIM — service provider configuration (unauthenticated)
      responses: { "200": { description: Configuration } }
  /api/admin/scim-operations:
    post:
      operationId: runScimOperation
      summary: Execute one outbound SCIM operation (admin only; requires ENABLE_SCIM_PROVISIONING)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, operation]
              properties:
                userId: { type: string }
                operation: { type: string, enum: [create, update, deactivate] }
      responses:
        "200": { description: Operation succeeded and was journaled. }
        "409": { description: Mapping conflict or the single-active journal blocks it. }
        "502": { description: Outcome unknown; reconciliation required. }
  /api/admin/scim-operations/{id}:
    get:
      operationId: getScimOperation
      summary: Read one journaled SCIM operation (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: The journal entry. }
        "404": { description: Not found. }
  /api/admin/directory-groups:
    get:
      operationId: listDirectoryGroups
      summary: List first-party directory groups (admin only)
      responses:
        "200": { description: Groups ordered by id. }
    post:
      operationId: createDirectoryGroup
      summary: Create a directory group (admin only; audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, pattern: "^[A-Za-z0-9_.-]{1,64}$" }
                description: { type: string }
      responses:
        "201": { description: Created. }
        "409": { description: Name already exists. }
  /api/admin/directory-groups/{id}:
    get:
      operationId: getDirectoryGroup
      summary: Group detail with members (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: The group with up to 500 members. }
    delete:
      operationId: deleteDirectoryGroup
      summary: Remove the group and its memberships (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Removed. }
  /api/admin/directory-groups/{id}/members:
    post:
      operationId: addDirectoryGroupMember
      summary: Grant membership to an existing user (admin only; audited)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        "201": { description: Granted. }
        "404": { description: User not found. }
        "409": { description: Already a member. }
  /api/admin/directory-groups/{id}/members/{userId}:
    delete:
      operationId: removeDirectoryGroupMember
      summary: Revoke membership (admin only; audited)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Revoked. }
        "404": { description: Membership not found. }
  /api/admin/wsfed-relying-parties:
    get:
      operationId: listWsfedRelyingParties
      summary: List WS-Federation relying parties (admin only)
      responses:
        "200": { description: Parties with enabled flags. }
    post:
      operationId: createWsfedRelyingParty
      summary: Register a WS-Federation relying party (disabled by default; admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [realm, replyUrl]
              properties:
                realm: { type: string, maxLength: 2048 }
                replyUrl: { type: string, format: uri }
      responses:
        "201": { description: Created disabled. }
        "409": { description: Realm already registered. }
  /api/admin/wsfed-relying-parties/{id}/enable:
    post:
      operationId: enableWsfedRelyingParty
      summary: Enable a WS-Federation relying party (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Enabled. }
  /api/admin/wsfed-relying-parties/{id}/disable:
    post:
      operationId: disableWsfedRelyingParty
      summary: Disable a WS-Federation relying party (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Disabled. }
  /api/admin/wsfed-relying-parties/{id}:
    delete:
      operationId: deleteWsfedRelyingParty
      summary: Remove a disabled WS-Federation relying party (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Removed. }
        "409": { description: Enabled parties must be disabled first. }
  /wsfed/signin:
    get:
      operationId: wsfedPassiveSignIn
      security: []
      summary: WS-Federation passive sign-in (wa=wsignin1.0; wsignout1.0 returns a cleanup page)
      parameters:
        - in: query
          name: wa
          required: true
          schema: { type: string }
        - in: query
          name: wtrealm
          schema: { type: string }
        - in: query
          name: wreply
          schema: { type: string }
        - in: query
          name: wctx
          schema: { type: string }
      responses:
        "200": { description: Auto-submitting POST form carrying the signed SAML 1.1 token to the registered reply URL. }
        "401": { description: Realm is not an enabled registration. }
        "503": { description: Signing material not configured. }
  /wsfed/metadata:
    get:
      operationId: wsfedFederationMetadata
      security: []
      summary: WS-Federation metadata with signing key and passive requestor endpoint
      responses:
        "200": { description: application/xml entity descriptor. }
        "503": { description: Signing material not configured. }
  /sign-in:
    get:
      operationId: oidcSignInHandoff
      security: []
      summary: OIDC login handoff page (the authorization endpoint redirects here with a signed oauth query)
      responses:
        "200": { description: The sign-in form; approval posts the signed query back to the authorization endpoint. }
        "400": { description: No signed continuation present. }
  /consent:
    get:
      operationId: oidcConsentPage
      security: []
      summary: OIDC consent page (renders the requested client and scopes; approval posts the signed query to the consent endpoint)
      responses:
        "200": { description: The consent form. }
        "400": { description: No signed continuation present. }
  /api/swa/grants:
    post:
      operationId: issueSwaGrant
      summary: Issue a five-minute single-use SWA grant for the acting user (same-origin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin]
              properties:
                origin: { type: string, description: Exact registered HTTPS origin }
      responses:
        "201": { description: Grant issued with its nonce. }
        "401": { description: Origin is not registered and enabled. }
  /api/swa/exchange:
    post:
      operationId: exchangeSwaGrant
      summary: Consume a grant nonce atomically (single use; same-origin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce]
              properties:
                nonce: { type: string }
      responses:
        "200": { description: Attestation with the application and expiry. }
        "401": { description: Unknown, replayed, expired nonce or user mismatch. }
  /api/admin/swa-applications:
    get:
      operationId: listSwaApplications
      summary: List SWA applications (admin only)
      responses:
        "200": { description: Applications with enabled flags. }
    post:
      operationId: createSwaApplication
      summary: Register an SWA application bound to an exact HTTPS origin (disabled by default; admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, origin]
              properties:
                name: { type: string, pattern: "^[A-Za-z0-9_.-]{1,64}$" }
                origin: { type: string, description: Exact HTTPS origin }
      responses:
        "201": { description: Created disabled. }
        "409": { description: Origin already registered. }
  /api/admin/swa-applications/{id}:
    delete:
      operationId: deleteSwaApplication
      summary: Remove a disabled SWA application (admin only; audited)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Removed. }
        "409": { description: Enabled applications must be disabled first. }
  /api/admin/swa-applications/{id}/enable:
    post:
      operationId: enableSwaApplication
      summary: Enable an SWA application (admin only; audited)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Enabled. }
  /api/admin/swa-applications/{id}/disable:
    post:
      operationId: disableSwaApplication
      summary: Disable an SWA application (admin only; audited)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Disabled. }
  /api/admin/swa-applications/{id}/grants:
    get:
      operationId: listSwaApplicationGrants
      summary: Visible activity view with masked nonces (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Grants with consumed flags. }
  /api/admin/swa-revocations:
    post:
      operationId: revokeUserSwaGrants
      summary: Immediately burn a user's outstanding SWA grants (admin only; audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        "200": { description: The number of grants revoked. }
  /api/admin/usage-snapshot:
    get:
      operationId: getUsageSnapshot
      summary: Row counts per bounded surface for the budget review (admin only)
      responses:
        "200":
          description: Counts captured at the call time.
          content:
            application/json:
              schema:
                type: object
                required: [capturedAt, counts]
                properties:
                  capturedAt: { type: string, format: date-time }
                  counts: { type: object, additionalProperties: { type: integer } }

components:
  securitySchemes:
    inboundScimBearer:
      type: http
      scheme: bearer
      description: Static inbound-SCIM bearer token (INBOUND_SCIM_BEARER_TOKEN).
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: >-
        Better Auth cookie name may be prefixed in HTTPS environments. Treat as
        an opaque HttpOnly browser cookie.
    migrationBearer:
      type: http
      scheme: bearer
      description: Short-lived operator-controlled migration token.
    bootstrapBearer:
      type: http
      scheme: bearer
      description: Short-lived first-administrator bootstrap token.
  schemas:
    AuditEvent:
      type: object
      required:
        - id
        - occurred_at
        - event_type
        - outcome
        - request_path
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        actor_user_id: { type: [string, "null"] }
        target_user_id: { type: [string, "null"] }
        event_type: { type: string }
        outcome:
          type: string
          enum: [started, success, failure]
        request_path: { type: string }
