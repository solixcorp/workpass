type = "decision"
title = "Use TypeScript as the default Workers implementation language"
description = "Use TypeScript for the Workers application, management API and integrations as the default because it aligns with the Workers runtime and supports a single typed application stack. Confirm the choice in Phase 0 against vetted identity-library compatibility, cryptographic support, runtime limits and any need for a separate engine."
