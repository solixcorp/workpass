[metadata]
date = "2026-11-12"
rationale = "OPAQUE RegistrationRecords cryptographically cannot reveal password complexity, so a claimed server-side check would be fake enforcement. The honest fix enforces rules where the server receives plaintext and labels OPAQUE flows advisory in the API payload and docs; the residual risk stays owner-visible."

