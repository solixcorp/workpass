title = "Set a five-minute IdP revocation target and track downstream limits"
description = "Revoke IdP-managed sessions within five minutes of employee suspension or offboarding. For downstream apps, target the same window only where the application exposes a suitable revocation or deprovisioning mechanism; document each app’s actual enforcement limit and track exceptions or failures rather than claiming a guarantee the app cannot provide."
