title = "Decide password MFA policy after the feasibility proof of concept"
description = "Do not select additional MFA factors or assurance rules before the feasibility proof of concept. After evaluating the identity engine, recovery paths and operational constraints, decide whether password sign-in requires additional factors and which privileged actions require step-up. Passkeys remain an independent sign-in method."
