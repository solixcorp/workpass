type = "decision"
title = "Separate security audit records from operational logs"
description = "Store structured security and account-management audit events in D1 for application-level querying with a minimum one-year retention period. Use Workers Logs for operational diagnostics; do not log secrets or substitute sampled operational logs for required audit events. Independent backups, tamper-evidence, audit-write-failure behavior and Workers Logs retention remain open."
