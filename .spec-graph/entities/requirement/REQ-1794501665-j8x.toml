type = "requirement"
title = "Reverify password and a second check before adding any MFA factor; device assessment always runs"
description = "Adding any second factor (authenticator app, security token, one-time codes, passkey) requires the acting session to re-prove the account password via a session-bound OPAQUE exchange that issues no session, and a second verification within 10 minutes: an existing factor, or an emailed one-time code when the account has none. Device assessment (Fingerprint) runs whenever the server key exists; FINGERPRINT_BREAK_GLASS is the only off switch."
