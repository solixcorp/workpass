title = "Privileged administration rejects challenge-pending sessions (F3)"
description = "A session that has not completed a required MFA/step-up challenge must not reach privileged effects. Enforced centrally in requireAdministrator (covers ~30 /api/admin/* subrouters and separately mounted guarded routes) and in the auth proxy middleware for better-auth admin endpoints. Attack chain (F3): OPAQUE login creates a real session plus a pending challenge (src/auth/opaque-routes.ts:401-460); requireAdministrator checked only session+role+origin (src/security/authorization.ts:26-42)."
