id = "REQ-1794459899-ebe"
type = "requirement"
title = "Step-up satisfaction is session-scoped with audited rotation lineage (F7)"
description = "A step-up challenge may only be satisfied by the acting session's own verification. When a verified session rotation happens (same-user successor after a verified predecessor is deleted), the pending challenge is explicitly transferred to the successor and one audit event records the SHA-256 digests of the predecessor/successor tokens. Independent sessions of the same user never satisfy each other's challenges."
