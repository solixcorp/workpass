title = "Explain device trust to its owner and expose fingerprint evidence to administrators"
description = "Each signed-in device on the security page shows a coarse trust grade and score derived from the verdict recorded at sign-in, or states that no assessment exists. Administrators can read every recorded fingerprint signal, verdict and reason per observation, identified only by keyed digests. Raw visitor IDs and addresses are never stored with observations."
