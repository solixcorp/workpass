type = "requirement"
title = "STARTTLS-selected SMTP requires a successful TLS upgrade before AUTH/delivery (F8)"
description = "When the starttls transport is selected (explicitly or by port 587), a missing STARTTLS advertisement or a failed/timed-out upgrade aborts before any AUTH or message bytes; delivery failures propagate observably. Explicit plaintext transports and implicit-TLS ports are unaffected. Evidence: audit codex-scan-1 F8 - maybeStartTls returned plaintext EHLO capabilities and deliver proceeded (CWE-757)."
