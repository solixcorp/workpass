title = "Complete and visible offboarding with five-minute revocation target"
description = "Disable the IdP account and revoke IdP-managed sessions within five minutes. For each downstream application, initiate supported deprovisioning/session-revocation mechanisms toward the same five-minute target, and document the application-specific enforcement limit. Track unsupported, delayed or failed revocation as an explicit exception; never claim downstream sessions are revoked when the application cannot confirm it."
