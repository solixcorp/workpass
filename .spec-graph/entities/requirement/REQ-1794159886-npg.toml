title = "Cloudflare-hosted identity platform with minimal services"
description = "Host the identity platform on Cloudflare with the smallest justified service set and strong operational/audit logging. Support username-password and passkey sign-in, OIDC/OAuth, SAML, SCIM, Tailscale OIDC, WS-Federation and SWA. Explicitly exclude providing an LDAP server, RADIUS, Active Directory integration and Microsoft Entra synchronization. Minimize costs; review any paid plan or additional service before adoption."
