title = "Refresh issuance re-evaluates entitlement fail-closed; entitlement loss revokes tokens (F2)"
description = "POST /api/auth/oauth2/token grant_type=refresh_token re-evaluates the CURRENT oidc:<clientId> application access policy for the token's user before provider issuance; denials and evaluation errors are rejected fail-closed and audited. Group-membership removal and application assignment changes revoke the affected users' tokens for that client atomically. Evidence: audit codex-scan-1 F2 - refresh never re-checked policy and membership/assignment changes did not revoke (src/admin/directory.ts:176-192, src/applications/integration-routes.ts:213-255)."
