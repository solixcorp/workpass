title = "Device safety score and grade follow the Fingerprint Pro Suspect Score"
description = "When a Suspect Score was recorded, the displayed safety score is 100 minus it (clamped 0-100) and the grade is only the score band: risky 0-29, review 30-59, normal 60-84, trusted 85-100. The sign-in verdict and reasons no longer cap or move either value. Observations without a Suspect Score keep the verdict and reason-count fallback."
