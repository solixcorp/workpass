description = "The security page offers 'trust' on a signed-in device that has a linked fingerprint record. It needs the same fresh password and second verification as adding a factor, is refused for bot, tampering, Tor and blocklisted-IP devices, and lasts 30 days. The device safety score is 100 minus the Fingerprint Pro Suspect Score when one was recorded. Enrolled second-factor methods show a check icon and green badge."
