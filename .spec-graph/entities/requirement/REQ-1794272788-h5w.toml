id = "REQ-1794272788-h5w"
type = "requirement"
title = "Email delivery supports operator-selected providers (SMTP, Resend, Cloudflare Email Sending, Maileroo, Amazon SES)"
description = "Transactional (invitation) and OTP email delivery must work through any of five providers: SMTP, Resend, Cloudflare Email Sending REST API, Maileroo basic API (templates excluded), or Amazon SES v2 API. The deployment selects one provider per environment configuration. Behaviors that must hold: modular provider implementations behind a shared interface; fail-closed delivery when no provider is configured (never silently drop); existing dev/mock webhook override paths keep working; legacy Resend-only deployments keep working without changes."
